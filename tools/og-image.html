<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Afiches · imagen para compartir</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#fff}
body{font-family:Poppins,Arial,sans-serif;color:#20232b}
.og{position:relative;width:1200px;height:630px;padding:70px 80px;background:linear-gradient(160deg,#fff 0%,#f7f5fe 100%);overflow:hidden}
.ring{position:absolute;top:-200px;left:-260px;width:760px;height:760px;border:130px solid #7c3aed08;border-radius:50%}
.logo{position:relative;width:210px}
h1{position:relative;margin-top:62px;font-size:70px;line-height:1.07;font-weight:600;letter-spacing:-.05em;max-width:760px}
h1 .p{color:#7c3aed}h1 .g{color:#118348}
p{position:relative;margin-top:24px;font-size:26px;color:#727786;max-width:720px;line-height:1.45}
.url{position:absolute;left:80px;bottom:56px;font-size:22px;font-weight:600;color:#7c3aed}
.balls{position:absolute;right:70px;top:150px;width:300px;height:360px}
.balls span{position:absolute;border-radius:50%;box-shadow:0 14px 26px -16px #171c1f80}
.balls .ringed:after{content:'';position:absolute;inset:27%;background:#f7f5fe;border-radius:50%}
[data-l]{display:none}html[lang=es] [data-l=es],html[lang=en] [data-l=en]{display:block}
</style>
</head>
<body>
<div class="og">
  <div class="ring"></div>
  <img class="logo" src="../public/afiches-logo-color.svg" alt="Afiches">
  <div data-l="es"><h1 style="font-size:58px;margin-top:52px;max-width:700px">Investigación <span class="p">cualitativa</span> y <span class="p">cuantitativa</span> potenciada por <span class="g">IA</span></h1><p style="font-size:24px">Consultora de investigación de mercado y opinión pública.</p></div>
  <div data-l="en"><h1><span class="p">Qualitative</span> &amp; <span class="p">quantitative</span> research powered by <span class="g">AI</span></h1><p>Market research and public opinion firm.</p></div>
  <span class="url">afiches.net</span>
  <div class="balls" aria-hidden="true">
    <span style="width:140px;height:140px;background:#7c3aed;left:140px;top:0"></span>
    <span class="ringed" style="width:112px;height:112px;background:#22d46a;left:20px;top:84px"></span>
    <span style="width:84px;height:84px;background:#bae6fd;left:190px;top:156px"></span>
    <span style="width:124px;height:124px;background:#f97316;left:76px;top:210px"></span>
    <span style="width:90px;height:90px;background:#ddd6fe;left:196px;top:262px"></span>
  </div>
</div>
<script>const l=new URLSearchParams(location.search).get('lang');if(l)document.documentElement.lang=l;</script>
</body>
</html>
